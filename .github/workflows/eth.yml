name: Eth-call-bot

on:
  workflow_dispatch:
  schedule:
    # Restart every 6 hours so the bot is always running
    - cron: "0 */6 * * *"

# Don't stack runs: let the current one finish, then start the next
concurrency:
  group: eth-call-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test webhook and Kalshi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Discord status:"
          curl -sS -o /dev/null -w "%{http_code}\n" -H "Content-Type: application/json" -d '{"content":"webhook test from GitHub"}' "$DISCORD_WEBHOOK_URL" || true
          echo "Kalshi markets:"
          curl -sS "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXETH15M&status=open&limit=3" | head -c 300 || true

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_SECONDS: "20400"
          PYTHONUNBUFFERED: "1"
        run: python eth.py
